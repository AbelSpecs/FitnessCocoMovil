workflows:
  ios-release:
    name: iOS Release Build
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: CodemagicBuild_Key
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build iOS Archive (no codesign)
        script: |
          flutter build ipa --release --no-codesign
      - name: Export and Sign IPA
        script: |
          # 1. Encontrar la ruta del perfil instalado por Codemagic en el sistema
          PROFILE_PATH=$(find "$HOME/Library/MobileDevice/Provisioning Profiles" -name "*.mobileprovision" 2>/dev/null | head -n 1)

          if [ -z "$PROFILE_PATH" ]; then
            PROFILE_PATH=$(find /Users/builder -name "*.mobileprovision" 2>/dev/null | head -n 1)
          fi

          echo "Ruta encontrada del perfil: $PROFILE_PATH"

          # 2. Extraer el UUID oficial embebido en el perfil
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          echo "Usando Perfil UUID: $PROFILE_UUID"

          # 3. Crear el ExportOptions con estructura Dictionary y Apple Distribution explícito
          cat <<EOF > /Users/builder/custom_export_options.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>Z7554MJ336</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.geeksolutions.pyrosfit</key>
              <string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          EOF

          # 4. Exportar el IPA
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist /Users/builder/custom_export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
