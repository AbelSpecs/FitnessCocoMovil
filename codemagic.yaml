workflows:
  ios-release:
    name: iOS Release Build
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: CodemagicBuild_Key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.geeksolutions.pyrosfit
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Debug and Verify Profiles
        script: |
          echo "=== Listando perfiles en el sistema ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles" || true
          echo "=== Listando identidades en Keychain ==="
          security find-identity -v -p codesigning || true
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build iOS Archive (no codesign)
        script: |
          flutter build ipa --release --no-codesign
      - name: Export and Sign IPA
        script: |
          # 1. Localizar el perfil instalado
          PROFILE_PATH=$(find "$HOME/Library/MobileDevice/Provisioning Profiles" -name "*.mobileprovision" | head -n 1)

          if [ -z "$PROFILE_PATH" ]; then
            echo "ERROR CRÍTICO: No se encontró ningún archivo .mobileprovision en la máquina virtual."
            exit 1
          fi

          echo "Ruta encontrada: $PROFILE_PATH"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< $(security cms -D -i "$PROFILE_PATH"))
          echo "Nombre del Perfil: $PROFILE_NAME"

          # 2. Generar el export options válido
          cat <<EOF > /Users/builder/custom_export_options.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>Z7554MJ336</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.geeksolutions.pyrosfit</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          # 3. Exportar IPA
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist /Users/builder/custom_export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
